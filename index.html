<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Osint-Tools — каталог инструментов сквада.">
  <title>Osint-Tools</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="graph-page" aria-label="Граф категорий">
    <div class="graph-scene">
      <svg id="graphSvg" class="graph-svg" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true"></svg>

      <div class="graph-node">
        <span class="node-mark">⌁</span>
        <span class="node-text">OSINT Catalog</span>
      </div>

      <div class="graph-categories" id="graphCategories" aria-live="polite"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
